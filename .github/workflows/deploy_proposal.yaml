name: Deploy the proposal test site

# Test deployment only (branch deploy/proposal-catalog on the fork, never upstream).
# Runs the real deploy workflow with the test config wrangler.proposal.jsonc, whose
# env.staging is the fork owner's Worker on hackdex.vllni.dev. Builds in CI because
# the devcontainer can't hold a Next.js build.
on:
  push:
    branches: [deploy/proposal-catalog]
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy_cloudflare.yaml
    with:
      environment: staging
      wrangler-config: wrangler.proposal.jsonc
    secrets: inherit
